<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Voice Alarm</title>
    
    <!-- Home Screen App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMTAwIDEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NSIgZmlsbD0iIzBmMGYxMyIgc3Ryb2tlPSIjMDBlNWZmIiBzdHJva2Utd2lkdGg9IjUiLz48cGF0aCBkPSJNMzUgNTAgTDUwIDM1IEw2NSA1MCIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utd2lkdGg9IjUiIGZpbGw9Im5vbmUiLz48cGF0aCBkPSJNNTAgMzUgTDUwIDc1IiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS13aWR0aD0iNSIvPjwvc3ZnPg==">

    <style>
        :root {
            --bg-color: #0f0f13;
            --surface-color: #1c1c24;
            --primary-color: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --danger: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Nightstand / Ultra Dim OLED-Safe Mode */
        body.nightstand {
            background-color: #000000 !important;
        }

        body.nightstand .alarm-controls,
        body.nightstand .alarm-list-container,
        body.nightstand .nightstand-bar,
        body.nightstand .version-tracker {
            opacity: 0; /* Completely invisible */
            transition: opacity 0.5s ease;
        }

        /* Show controls again if the user taps/interacts with them */
        body.nightstand .alarm-controls:hover,
        body.nightstand .alarm-list-container:hover,
        body.nightstand .nightstand-bar:hover,
        body.nightstand .version-tracker:hover,
        body.nightstand .alarm-controls:active,
        body.nightstand .alarm-list-container:active,
        body.nightstand .nightstand-bar:active,
        body.nightstand .version-tracker:active {
            opacity: 1; 
        }

        body.nightstand #time-display {
            color: rgba(255, 255, 255, 0.05); /* Extremely dim white/grey */
            text-shadow: none;
        }

        body.nightstand #date-display {
            color: rgba(0, 229, 255, 0.08); /* Extremely dim primary color */
        }

        /* Ringing Animation */
        body.ringing {
            animation: flashBg 1s infinite alternate;
        }
        @keyframes flashBg {
            0% { background-color: var(--bg-color); }
            100% { background-color: #4a0000; }
        }

        .clock-container {
            text-align: center;
            margin: 8vh 0 30px 0;
            transition: transform 1s ease-in-out; /* Smooth pixel shifting */
        }

        #time-display {
            font-size: 5rem;
            font-weight: 200;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            font-variant-numeric: tabular-nums;
            transition: color 0.5s ease;
        }

        #date-display {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.5s ease;
        }

        .nightstand-bar {
            background: var(--surface-color);
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .alarm-controls {
            background: var(--surface-color);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            margin-bottom: 25px;
            width: 100%;
            max-width: 400px;
        }

        input[type="time"] {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.2rem;
            flex-grow: 1;
            color-scheme: dark;
        }

        button {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .alarm-list-container {
            width: 100%;
            max-width: 400px;
        }

        .alarm-list-container h3 {
            margin-bottom: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #alarms-list {
            list-style: none;
        }

        .alarm-item {
            background: var(--surface-color);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .alarm-item.inactive {
            opacity: 0.5;
        }

        .alarm-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle-switch {
            width: 50px;
            height: 28px;
            background: #333;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active {
            background: var(--primary-color);
        }

        .toggle-switch.active::after {
            transform: translateX(22px);
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            font-size: 1.2rem;
            padding: 5px;
        }

        #ringing-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #ringing-modal.visible {
            opacity: 1;
            pointer-events: all;
        }

        #ringing-modal h1 {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--primary-color);
        }

        #ringing-modal p {
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .mic-icon {
            font-size: 4rem;
            animation: pulse 1s infinite alternate;
        }

        .mic-text {
            color: var(--danger);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .transcript-preview {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 1rem;
            min-height: 24px;
            font-style: italic;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 59, 48, 0.5); }
            100% { transform: scale(1.2); text-shadow: 0 0 30px rgba(255, 59, 48, 1); }
        }

        /* Version Tracker */
        .version-tracker {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 10px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="clock-container" id="clock-wrapper">
        <div id="time-display">00:00:00</div>
        <div id="date-display">Loading...</div>
    </div>

    <!-- Nightstand Mode Toggle -->
    <div class="nightstand-bar">
        <span>Nightstand Mode (Keep Awake + Dim)</span>
        <div class="toggle-switch" id="nightstand-toggle" onclick="toggleNightstand()"></div>
    </div>

    <div class="alarm-controls">
        <input type="time" id="alarm-time-input" required>
        <button onclick="addAlarm()">Set Alarm</button>
    </div>

    <div class="alarm-list-container">
        <h3>Active Alarms</h3>
        <ul id="alarms-list">
            <!-- Alarms injected here via JS -->
        </ul>
    </div>

    <!-- Live Version Tracker -->
    <div class="version-tracker">
        <strong>v1.4</strong> | Ultra-dim OLED-Safe Night Mode (Controls invisible until tapped)
    </div>

    <div id="ringing-modal">
        <h1>WAKE UP!</h1>
        <p id="ringing-time">00:00 AM</p>
        
        <div class="mic-container">
            <div class="mic-icon">🎙️</div>
            <div class="mic-text">YELL "STOP" TO DISMISS</div>
            <div class="transcript-preview" id="live-transcript">...</div>
        </div>
    </div>

    <script>
        // --- STATE ---
        let alarms = [];
        let currentlyRingingId = null;
        
        // Audio & Speech State
        let audioCtx;
        let beepingInterval;
        let speechRecognition;
        let audioUnlocked = false;

        // WakeLock & Nightstand State
        let wakeLock = null;
        let isNightstandActive = false;
        let pixelShiftInterval = null;

        // --- iOS AUDIO UNLOCK ---
        function unlockAudio() {
            if (audioUnlocked) return;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0; 
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start(0);
            oscillator.stop(audioCtx.currentTime + 0.1);

            audioUnlocked = true;
            
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('click', unlockAudio);
        }

        document.addEventListener('touchstart', unlockAudio);
        document.addEventListener('click', unlockAudio);

        // --- NIGHTSTAND & WAKE LOCK LOGIC ---
        function toggleNightstand() {
            setNightstandMode(!isNightstandActive);
        }

        async function setNightstandMode(active) {
            if (isNightstandActive === active) return; 
            
            unlockAudio();
            isNightstandActive = active;
            const toggleBtn = document.getElementById('nightstand-toggle');

            if (isNightstandActive) {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.log('WakeLock Error:', err);
                }

                document.body.classList.add('nightstand');
                toggleBtn.classList.add('active');

                if (!pixelShiftInterval) {
                    pixelShiftInterval = setInterval(shiftPixels, 30000); // Shifts every 30s
                }
            } else {
                document.body.classList.remove('nightstand');
                toggleBtn.classList.remove('active');

                if (wakeLock !== null) {
                    wakeLock.release();
                    wakeLock = null;
                }

                if (pixelShiftInterval) {
                    clearInterval(pixelShiftInterval);
                    pixelShiftInterval = null;
                }

                document.getElementById('clock-wrapper').style.transform = 'translate(0px, 0px)';
            }
        }

        function shiftPixels() {
            // Randomly shift up to 15px in any direction to prevent OLED burn-in
            const x = Math.floor(Math.random() * 30) - 15;
            const y = Math.floor(Math.random() * 30) - 15;
            document.getElementById('clock-wrapper').style.transform = `translate(${x}px, ${y}px)`;
        }

        // --- INITIALIZE SPEECH RECOGNITION ---
        function initSpeechAPI() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }

            speechRecognition = new SpeechRecognition();
            speechRecognition.continuous = true;
            speechRecognition.interimResults = true;
            speechRecognition.lang = 'en-US';

            speechRecognition.onresult = (event) => {
                let currentTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript.toLowerCase();
                }
                
                document.getElementById('live-transcript').innerText = `Hearing: "${currentTranscript.trim()}"`;

                if (currentTranscript.includes("stop")) {
                    dismissAlarm();
                }
            };

            speechRecognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                document.getElementById('live-transcript').innerText = `Error: ${event.error}. Keep yelling!`;
            };

            speechRecognition.onend = () => {
                if (currentlyRingingId) {
                    try { speechRecognition.start(); } catch (e) {}
                }
            };
        }

        initSpeechAPI();

        // --- CLOCK LOGIC ---
        function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            
            const timeStr = 
                String(hours).padStart(2, '0') + ':' + 
                String(minutes).padStart(2, '0') + ':' + 
                String(seconds).padStart(2, '0') + ' ' + ampm;
                
            document.getElementById('time-display').innerText = timeStr;

            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-US', options);

            checkAlarms(now);
            requestAnimationFrame(updateClock);
        }

        // --- ALARM LOGIC ---
        function addAlarm() {
            unlockAudio();
            
            if (speechRecognition) {
                try {
                    speechRecognition.start();
                    setTimeout(() => speechRecognition.stop(), 500); 
                } catch(e) {}
            }

            const input = document.getElementById('alarm-time-input');
            const timeVal = input.value;
            
            if (!timeVal) {
                alert("Please select a time!");
                return;
            }

            const newAlarm = {
                id: Date.now().toString(),
                time24: timeVal, 
                display: format24to12(timeVal),
                active: true,
                hasRungToday: false 
            };

            alarms.push(newAlarm);
            alarms.sort((a, b) => a.time24.localeCompare(b.time24));
            
            input.value = ''; 
            renderAlarms();

            // Auto-trigger Nightstand Mode 3 seconds after setting an alarm
            setTimeout(() => {
                setNightstandMode(true);
            }, 3000);
        }

        function toggleAlarm(id) {
            const alarm = alarms.find(a => a.id === id);
            if (alarm) {
                alarm.active = !alarm.active;
                alarm.hasRungToday = false; 
                renderAlarms();
            }
        }

        function deleteAlarm(id) {
            alarms = alarms.filter(a => a.id !== id);
            renderAlarms();
        }

        function renderAlarms() {
            const list = document.getElementById('alarms-list');
            list.innerHTML = '';

            if (alarms.length === 0) {
                list.innerHTML = '<li style="color: var(--text-muted); text-align: center; padding: 20px;">No alarms set.</li>';
                return;
            }

            alarms.forEach(alarm => {
                const li = document.createElement('li');
                li.className = `alarm-item ${alarm.active ? '' : 'inactive'}`;
                
                li.innerHTML = `
                    <span>${alarm.display}</span>
                    <div class="alarm-actions">
                        <div class="toggle-switch ${alarm.active ? 'active' : ''}" onclick="toggleAlarm('${alarm.id}')"></div>
                        <button class="delete-btn" onclick="deleteAlarm('${alarm.id}')">✕</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function checkAlarms(now) {
            if (currentlyRingingId) return; 

            const currentHour = String(now.getHours()).padStart(2, '0');
            const currentMin = String(now.getMinutes()).padStart(2, '0');
            const currentTime24 = `${currentHour}:${currentMin}`;

            alarms.forEach(a => {
                if (a.hasRungToday && currentTime24 !== a.time24) {
                    a.hasRungToday = false; 
                }
            });

            const ringingAlarm = alarms.find(a => a.active && a.time24 === currentTime24 && !a.hasRungToday);

            if (ringingAlarm) {
                triggerAlarm(ringingAlarm);
            }
        }

        function format24to12(time24) {
            let [h, m] = time24.split(':');
            h = parseInt(h);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }

        // --- ALERT & AUDIO SYSTEM ---
        function triggerAlarm(alarm) {
            currentlyRingingId = alarm.id;
            alarm.hasRungToday = true;

            setNightstandMode(false);

            document.getElementById('ringing-time').innerText = alarm.display;
            document.getElementById('ringing-modal').classList.add('visible');
            document.body.classList.add('ringing');
            document.getElementById('live-transcript').innerText = "...";

            startBeeping();
            
            if (speechRecognition) {
                try {
                    speechRecognition.start();
                } catch (e) {}
            }
        }

        function dismissAlarm() {
            stopBeeping();
            document.getElementById('ringing-modal').classList.remove('visible');
            document.body.classList.remove('ringing');
            
            if (currentlyRingingId) {
                const alarm = alarms.find(a => a.id === currentlyRingingId);
                if (alarm) alarm.active = false;
                renderAlarms();
            }
            
            currentlyRingingId = null;
            
            if (speechRecognition) {
                speechRecognition.stop();
            }
        }

        function playSingleBeep() {
            if (!audioCtx) return;
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square'; 
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.01);
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime + 0.1);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        function startBeeping() {
            unlockAudio();
            beepingInterval = setInterval(() => {
                playSingleBeep();
                setTimeout(playSingleBeep, 200); 
            }, 1000);
        }

        function stopBeeping() {
            if (beepingInterval) {
                clearInterval(beepingInterval);
                beepingInterval = null;
            }
        }

        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
